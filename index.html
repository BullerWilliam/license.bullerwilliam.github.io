<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>License</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
	margin: 0;
	font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
	background: linear-gradient(135deg, #020617, #0f172a);
	color: white;
	min-height: 100vh;
	display: flex;
	justify-content: center;
	align-items: center;
}

.wrapper {
	width: min(1100px, 94%);
	background: rgba(2, 6, 23, 0.92);
	border-radius: 22px;
	padding: 34px;
	box-shadow: 0 25px 60px rgba(0,0,0,0.65);
	animation: fadeIn 0.6s ease;
}

h1 {
	margin-top: 0;
	font-size: 36px;
}

.subtitle {
	opacity: 0.65;
	margin-bottom: 22px;
}

.editor {
	display: grid;
	grid-template-columns: 1fr 1fr;
	gap: 22px;
}

textarea {
	width: 100%;
	min-height: 460px;
	background: #020617;
	color: white;
	border: 1px solid rgba(255,255,255,0.15);
	border-radius: 16px;
	padding: 18px;
	font-size: 14px;
	resize: vertical;
	outline: none;
}

.preview {
	min-height: 460px;
	background: #020617;
	border: 1px solid rgba(255,255,255,0.15);
	border-radius: 16px;
	padding: 22px;
	overflow-y: auto;
}

.preview h1,
.preview h2,
.preview h3 {
	margin-top: 0;
}

.preview a {
	color: #38bdf8;
	text-decoration: none;
}

.preview a:hover {
	text-decoration: underline;
}

.preview code {
	background: rgba(255,255,255,0.08);
	padding: 2px 6px;
	border-radius: 6px;
}

.preview pre {
	background: rgba(255,255,255,0.08);
	padding: 12px;
	border-radius: 10px;
	overflow-x: auto;
}

.actions {
	margin-top: 26px;
	display: flex;
	justify-content: space-between;
	align-items: center;
	flex-wrap: wrap;
	gap: 12px;
}

a.back {
	color: #38bdf8;
	text-decoration: none;
	font-size: 14px;
	opacity: 0.9;
}

a.back:hover {
	text-decoration: underline;
}

button {
	background: #38bdf8;
	color: #020617;
	border: none;
	border-radius: 12px;
	padding: 10px 20px;
	font-size: 14px;
	cursor: pointer;
	transition: transform 0.15s, background 0.15s;
}

button:hover {
	background: #0ea5e9;
	transform: translateY(-2px);
}

footer {
	margin-top: 30px;
	padding-top: 16px;
	border-top: 1px solid rgba(255,255,255,0.1);
	font-size: 13px;
	opacity: 0.6;
	text-align: center;
}

@keyframes fadeIn {
	from {
		opacity: 0;
		transform: translateY(12px);
	}
	to {
		opacity: 1;
		transform: translateY(0);
	}
}

@media (max-width: 900px) {
	.editor {
		grid-template-columns: 1fr;
	}
}
</style>
</head>
<body>

<div class="wrapper">
	<h1>License</h1>
	<p class="subtitle">Edit the license text below</p>

	<div class="editor">
		<textarea id="textInput">
Copyright © 2026 BullerWilliam

**BullerWilliam's Personal License (2026)**

The license applies from this commit (this version) and onward; it does **NOT** apply to older commits (older versions) or any version replaced by a newer license.

You **MAY**:
- **View**, **copy**, **edit** code for **personal** and **educational** use.
- **Mirror** the **original** version (**without** any **modification**)

You **MAY NOT**:
- **Sell**, **Share** the **code** or any **modified** version, **publicly** or **privately**.
- **Mirror** any **modified** version.

The code is provided **as-is**, without any warranty.
		</textarea>

		<div class="preview" id="preview"></div>
	</div>

	<div class="actions">
		<a class="back" href="index.html">← Back to home</a>
		<button onclick="download()">Download license.md</button>
	</div>

	<footer>
		© BullerWilliam
	</footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script>
const input = document.getElementById('textInput')
const preview = document.getElementById('preview')

function render() {
	preview.innerHTML = marked.parse(input.value)
}

function download() {
	const blob = new Blob([input.value], { type: 'text/markdown' })
	const a = document.createElement('a')
	a.href = URL.createObjectURL(blob)
	a.download = 'license.md'
	a.click()
	URL.revokeObjectURL(a.href)
}

input.addEventListener('input', render)
render()
</script>

</body>
</html>
